name: CI/CD EcoPulso

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Versión a desplegar (etiqueta, rama o commit). Ej.: v1.0.0 para volver a una versión estable'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pruebas:
    name: Instalar, probar y construir
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test
        env:
          ECOPULSO_ADMIN_TOKEN: ${{ secrets.ECOPULSO_ADMIN_TOKEN }}

      - name: Construir
        run: npm run build

      - name: Publicar artefacto para GitHub Pages
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    name: Desplegar en GitHub Pages
    needs: pruebas
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4

  verificar:
    name: Prueba de humo del sitio desplegado
    needs: desplegar
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar versión y página principal
        env:
          URL: ${{ needs.desplegar.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${URL}version.json"; then break; fi
            sleep 10
          done
          echo
          curl -fsS "${URL}" | grep -q "EcoPulso"
          curl -fsS "${URL}lecturas_ejemplo.csv" | head -n 2
